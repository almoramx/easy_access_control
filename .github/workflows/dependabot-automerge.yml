# A diferencia de las apps privadas (que usan el workflow_run hand-rolled de
# AlmoraInfrastructure porque el plan gratuito no les da branch protection),
# este repo es público: auto-merge nativo + required check `rspec` en main.
name: Dependabot Auto-Merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
